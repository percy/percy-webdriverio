version: 2
updates:
- package-ecosystem: npm
  directory: /
  labels:
    - ⬆️⬇️ dependencies
  schedule:
    interval: weekly
  commit-message:
    prefix: ⬆️
  # Update webdriverio and every @wdio/* package in one PR, so they stay on
  # the same version (WebdriverIO v10 migration guide).
  groups:
    webdriverio:
      patterns:
        - "webdriverio"
        - "@wdio/*"
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: ⬆️👷
  labels:
    - ⬆️⬇️ dependencies
