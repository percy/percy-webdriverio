name: Test
on: 
  push:
  workflow_dispatch:
    inputs:
      branch:
        required: false
        type: string
        default: master
permissions:
  contents: read

jobs:
  test:
    name: Test (wdio ${{ matrix.wdio }}${{ matrix.classic && ', classic' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wdio: 6, node: 20 }
          - { wdio: 7, node: 20 }
          - { wdio: 8, node: 20 }
          - { wdio: 9, node: 20 }
          # webdriverio 9 and 10 default to BiDi; the classic jobs cover
          # switchFrame in a WebDriver Classic session (Safari, many cloud grids).
          - { wdio: 9, node: 20, classic: true }
          # webdriverio 10 needs Node 22.19 or later
          - { wdio: 10, node: 24 }
          - { wdio: 10, node: 24, classic: true }
    runs-on: ubuntu-latest
    steps:
      - uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2.0.2
        id: regex-match
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          text: ${{ github.event.inputs.branch }}
          regex: '^[a-zA-Z0-9_/\-]+$'
      - name: Break on invalid branch name
        run: exit 1
        if: ${{ github.event_name == 'workflow_dispatch' && steps.regex-match.outputs && steps.regex-match.outputs.match == '' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Setup firefox nightly
        # A hack to mock @wdio/runner in believing that we're using firefox nightly since it fails otherwise
        run: |
          sudo cp /usr/bin/firefox /usr/bin/firefox-nightly
          firefox-nightly --version
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: v1/${{ runner.os }}/node-${{ matrix.node }}/wdio-${{ matrix.wdio }}/${{ hashFiles('**/yarn.lock') }}
          restore-keys: v1/${{ runner.os }}/node-${{ matrix.node }}/wdio-${{ matrix.wdio }}/
      - run: yarn
      # yarn.lock holds webdriverio 9, so the other majors install the exact
      # versions in .github/wdio-versions.json: every run gets the same packages.
      # --ignore-engines: webdriverio 10 packages need Node 22.19.
      - name: Install webdriverio ${{ matrix.wdio }} (pinned)
        if: ${{ matrix.wdio != 9 }}
        env:
          WDIO: ${{ matrix.wdio }}
        run: >-
          yarn add --dev --ignore-engines
          $(node -p "require('./.github/wdio-versions.json')[process.env.WDIO].join(' ')")
      # webdriverio 6 always passes -remote-debugging-port to Firefox, which
      # geckodriver 0.31 and later reject when it comes in the capabilities.
      - name: Use geckodriver 0.30.0 (webdriverio 6)
        if: ${{ matrix.wdio == 6 }}
        run: |
          cd node_modules/geckodriver
          rm -f geckodriver geckodriver.tar.gz
          GECKODRIVER_VERSION=0.30.0 node index.js
          ./geckodriver --version
      - name: Set up @percy/cli from git
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CLI_BRANCH: ${{ github.event.inputs.branch }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          cd /tmp
          git clone --branch "$CLI_BRANCH" --depth 1 https://github.com/percy/cli
          cd cli
          PERCY_PACKAGES=`find packages -type d -depth 1 | sed -e 's/packages/@percy/g' | tr '\n' ' '`
          git log -1
          yarn
          yarn build
          yarn global:link
          cd "$WORKSPACE"
          yarn remove @percy/cli && yarn link `echo $PERCY_PACKAGES`
          npx @percy/cli --version
      - run: yarn test:coverage
        env:
          WDIO_MAJOR: ${{ matrix.wdio }}
          WDIO_CLASSIC: ${{ matrix.classic && '1' || '' }}
