name: Pack
on: push
permissions:
  contents: read

jobs:
  pack:
    name: Pack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Install the packed tarball into a clean project and require it, so a
      # file missing from package.json "files" fails here instead of on npm.
      - name: Pack and require in a clean install
        run: |
          TARBALL="$PWD/$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$TARBALL"
          node -e "require('@percy/webdriverio')"
