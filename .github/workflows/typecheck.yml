name: Typecheck
on: push
permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (wdio ${{ matrix.wdio }})
    strategy:
      fail-fast: false
      matrix:
        # Same Node version per major as the Test workflow. webdriverio 10
        # needs Node >= 22.19, and setup-node can pick an older cached 22.x.
        include:
          - { wdio: 8, node: 20 }
          - { wdio: 9, node: 22 }
          - { wdio: 10, node: 24 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: v1/${{ runner.os }}/node-${{ matrix.node }}/wdio-${{ matrix.wdio }}/${{ hashFiles('**/yarn.lock') }}
          restore-keys: v1/${{ runner.os }}/node-${{ matrix.node }}/wdio-${{ matrix.wdio }}/
      - name: Install dependencies (webdriverio 10, from yarn.lock)
        if: ${{ matrix.wdio == 10 }}
        run: yarn install --frozen-lockfile
      # yarn.lock holds webdriverio 10 only, so the older majors install the
      # exact versions in .github/wdio-versions.json: every run gets the same
      # packages. --ignore-engines: the lockfile's v10 packages need Node 22.19.
      - name: Install dependencies (webdriverio ${{ matrix.wdio }}, pinned)
        if: ${{ matrix.wdio != 10 }}
        env:
          WDIO: ${{ matrix.wdio }}
        run: >- # zizmor: ignore[adhoc-packages] exact versions from .github/wdio-versions.json
          yarn add --dev --ignore-engines
          $(node -p "require('./.github/wdio-versions.json')[process.env.WDIO].join(' ')")
      - run: yarn test:types
      # Compiles the public types as a WebdriverIO 10 + TypeScript 6 user does.
      - name: Type-check a TypeScript consumer project
        if: ${{ matrix.wdio == 10 }}
        run: yarn test:types:consumer
